name = "pixelsigns"
pages_build_output_dir = "dist"
compatibility_date = "2025-09-23"
compatibility_flags = ["nodejs_compat"]

# Build environment variables (mirrors Cloudflare Pages dashboard)
# These get exposed to the Nitro build via import.meta.env / runtimeConfig.
# On Cloudflare Pages, the build command + output dir + env vars are also
# settable in the dashboard (Settings → Builds). The values below are the
# defaults so `wrangler pages dev` works the same locally.
[vars]
NUXT_PUBLIC_SITE_URL = "https://pixelsigns.art"
NUXT_PUBLIC_API_BASE_URL = "https://api.pixelsigns.art"

# Optional: override env vars per preview deployment
# [env.preview.vars]
# NUXT_PUBLIC_SITE_URL = "https://preview.pixelsigns.art"